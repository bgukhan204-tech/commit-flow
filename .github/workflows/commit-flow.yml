name: CommitFlow Auto Committer

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC (or daily)
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of commits to generate'
        required: true
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔧 Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: 🚀 Generate 10 Daily Commits
        env:
          COMMIT_COUNT: ${{ inputs.commit_count || '10' }}
        run: |
          node scripts/daily.js

      - name: 📤 Push to GitHub
        run: |
          git pull --rebase origin main || true
          git push origin main
